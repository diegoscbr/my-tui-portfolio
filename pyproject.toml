[project]
name = "diego-boats"
version = "0.1.0"
description = "SSH-accessible terminal portfolio at diego.boats"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.47.0",
    "asyncssh>=2.14.0",
    "python-frontmatter>=1.1.0",
]

[project.optional-dependencies]
build = [
    "ascii_magic>=2.3.0",
    "pillow>=10.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "textual-dev>=1.0.0",
]
